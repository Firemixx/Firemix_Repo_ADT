# Medical supply lockers

- type: entityTable
  id: LockerFillMedicine
  table: !type:AllSelector
    children:
    - !type:NestedSelector
      tableId: CoreMedicineReagentBottleTable
      rolls: 2
    - !type:GroupSelector # Basic topicals
      rolls: 7
      children:
      - id: Brutepack
      - id: Ointment
      - id: Bloodpack
      - id: Gauze
        weight: 0.5

- type: entity
  parent: LockerMedicine
  id: LockerMedicineFilled
  suffix: Filled
  components:
  - type: StorageFill
    contents:
      - id: BoxSyringe
      - id: ChemistryBottleEpinephrine
        amount: 1
      - id: Brutepack
        amount: 2
      - id: Ointment
        amount: 2
      # ADT tweak Start
      - id: ADTAntibioticOintment
        amount: 1
      - id: ADTPatchPackFilled
        amount: 1
      # ADT tweak End
      - id: Bloodpack
        amount: 2
      - id: Gauze

- type: entity
  parent: LockerWallMedical
  id: LockerWallMedicalFilled
  name: medicine wall locker
  suffix: Filled
  components:
  - type: StorageFill
    contents:
      - id: BoxSyringe
      - id: ChemistryBottleEpinephrine
        amount: 1
      - id: Brutepack
        amount: 2
      - id: Ointment
        amount: 2
      # ADT tweak Start
      - id: ADTAntibioticOintment
        amount: 1
      - id: ADTPatchPackFilled
        amount: 1
      # ADT tweak End
      - id: Bloodpack
        amount: 2
      - id: Gauze

